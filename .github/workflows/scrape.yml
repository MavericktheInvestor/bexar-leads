name: Scrape Bexar County Leads

on:
  schedule:
    - cron: "0 7 * * *"          # 07:00 UTC daily (2 AM CT)
  workflow_dispatch:              # manual trigger

permissions:
  contents: write

concurrency:
  group: "scrape"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      # ── Playwright ──────────────────────────────────────────────────────
      - name: Install Playwright + Chromium
        run: python -m playwright install --with-deps chromium

      # ── Ensure output dirs exist ─────────────────────────────────────────
      - name: Create output directories
        run: |
          mkdir -p dashboard
          mkdir -p data

      # ── Run scraper ──────────────────────────────────────────────────────
      - name: Run lead scraper
        run: python scraper/fetch.py
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SUBTRST_SHEET_ID: ${{ secrets.SUBTRST_SHEET_ID }}

      # ── Skip trace top 100 new leads ─────────────────────────────────────
      - name: Skip trace top 100 leads
        run: python scraper/skip_trace.py
        env:
          PYTHONUNBUFFERED: "1"
          SKIP_TRACE_GREEN_LIGHT: ${{ secrets.SKIP_TRACE_GREEN_LIGHT }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          DEALMACHINE_API_KEY: ${{ secrets.DEALMACHINE_API_KEY }}

      # ── Push skip traced leads to GHL (Jordan calls at 9am CT) ───────────
      - name: Push scraped leads to GHL
        run: python scraper/ghl_push.py
        env:
          PYTHONUNBUFFERED: "1"
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          GHL_PIPELINE_ID: ${{ secrets.GHL_PIPELINE_ID }}
          GHL_STAGE_ID: ${{ secrets.GHL_STAGE_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      # ── Commit results ───────────────────────────────────────────────────
      - name: Commit & push updated records
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/records.json data/records.json data/leads.csv || true
          git diff --cached --quiet || \
            git commit -m "chore: update leads $(date -u +%Y-%m-%d)"
          git push

